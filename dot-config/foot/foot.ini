# foot terminal. https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# "monospace" is Source Code Pro (/etc/fonts/conf.d/50-fenoa-monospace.conf). Noctalia adds its
# colour-theme include under [main] the first time it applies its foot template.
[main]
include=~/.config/foot/themes/noctalia
term=xterm-256color
shell=/var/home/rafael/.config/tmux/scripts/foot-session.sh
font=Source Code Pro:size=13
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
